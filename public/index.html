<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Decision & Action Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">📋</span>
        <div>
          <h1>Meeting Tracker</h1>
          <p>Decision &amp; Action Item Extractor</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="historyToggle" title="Meeting History">
          🗂️ History <span class="badge" id="historyCount">0</span>
        </button>
        <div class="status-dot" id="statusDot" title="Server status"></div>
      </div>
    </div>
  </header>

  <!-- ── Main Layout ─────────────────────────────────────────────────────────── -->
  <main class="main-layout">

    <!-- LEFT: History Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Past Meetings</h2>
        <button class="btn btn-ghost btn-sm" id="closeSidebar">✕</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty-state">No meetings analyzed yet.</p>
      </div>
    </aside>

    <!-- CENTER: Input + Results -->
    <div class="content-area">

      <!-- Input Card -->
      <section class="card input-card">
        <div class="card-header">
          <h2>📝 Paste Meeting Transcript</h2>
          <div class="input-controls">
            <label class="btn btn-ghost btn-sm" for="fileInput" title="Upload .txt file">
              📂 Upload
              <input type="file" id="fileInput" accept=".txt,.md" hidden />
            </label>
            <button class="btn btn-ghost btn-sm" id="loadSample">Load Sample</button>
            <button class="btn btn-ghost btn-sm" id="clearBtn">Clear</button>
          </div>
        </div>

        <div class="form-group">
          <input
            type="text"
            id="meetingTitle"
            placeholder="Meeting title (optional)"
            class="text-input"
            maxlength="100"
          />
        </div>

        <textarea
          id="transcriptInput"
          class="transcript-area"
          placeholder="Paste your meeting transcript here…

Example: 'Sarah said we should move the launch to Q3. John agreed and will update the project plan by Friday. The team decided to drop Feature X from scope…'"
          spellcheck="true"
        ></textarea>

        <div class="input-footer">
          <span class="char-count" id="charCount">0 characters</span>
          <button class="btn btn-primary" id="analyzeBtn">
            <span class="btn-text">✨ Analyze Transcript</span>
            <span class="btn-spinner hidden">⏳ Analyzing…</span>
          </button>
        </div>
      </section>

      <!-- Error Banner -->
      <div class="error-banner hidden" id="errorBanner">
        <span class="error-icon">⚠️</span>
        <span id="errorMessage"></span>
        <button class="btn btn-ghost btn-sm" id="dismissError">✕</button>
      </div>

      <!-- Results Section (hidden until analysis) -->
      <section class="results-section hidden" id="resultsSection">

        <!-- Meeting Meta -->
        <div class="results-header">
          <div>
            <h2 id="resultTitle" class="result-title"></h2>
            <p class="result-meta" id="resultMeta"></p>
          </div>
          <div class="result-actions">
            <button class="btn btn-ghost btn-sm" id="copyBtn" title="Copy as Markdown">📋 Copy</button>
            <button class="btn btn-ghost btn-sm" id="downloadBtn" title="Download JSON">⬇️ Export</button>
          </div>
        </div>

        <!-- Summary -->
        <div class="card summary-card">
          <h3>📌 Meeting Summary</h3>
          <p id="summaryText"></p>
          <div class="summary-chips" id="summaryChips"></div>
        </div>

        <!-- Stats row -->
        <div class="stats-row" id="statsRow"></div>

        <!-- Decisions -->
        <div class="card" id="decisionsCard">
          <h3>⚖️ Decisions Made <span class="count-badge" id="decisionsCount"></span></h3>
          <div id="decisionsList" class="item-list"></div>
        </div>

        <!-- Action Items -->
        <div class="card" id="actionsCard">
          <div class="card-header-row">
            <h3>✅ Action Items <span class="count-badge" id="actionsCount"></span></h3>
            <div class="filter-row">
              <button class="filter-btn active" data-filter="all">All</button>
              <button class="filter-btn" data-filter="High">🔴 High</button>
              <button class="filter-btn" data-filter="Medium">🟡 Medium</button>
              <button class="filter-btn" data-filter="Low">🟢 Low</button>
            </div>
          </div>
          <div class="table-wrapper">
            <table class="action-table" id="actionsTable">
              <thead>
                <tr>
                  <th>Task</th>
                  <th>Owner</th>
                  <th>Deadline</th>
                  <th>Priority</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="actionsTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Participants -->
        <div class="card participants-card" id="participantsCard">
          <h3>👥 Participants</h3>
          <div id="participantsList" class="chips-row"></div>
        </div>

      </section>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
